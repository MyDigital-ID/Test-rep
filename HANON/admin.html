<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="./">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم حنون | HANON STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D;
    --bg-2: #171717;
    --bg-3: #1F1F1F;
    --bg-4: #262626;
    --card: #1A1A1A;
    --card-hover: #222222;
    --orange: #FF6B1A;
    --orange-dark: #E65A0F;
    --orange-light: #FF8B4A;
    --text: #FFFFFF;
    --text-muted: #999999;
    --text-dim: #666666;
    --border: #2A2A2A;
    --border-light: #333333;
    --danger: #E74C3C;
    --success: #27AE60;
    --shadow: rgba(0, 0, 0, 0.6);
    --shadow-orange: 0 4px 20px rgba(255, 107, 26, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    font-size: 16px;
  }

  /* ============ Login ============ */
  .login-wrap {
    max-width: 440px;
    margin: 8vh auto;
    background: var(--bg-2);
    border: 3px solid var(--orange);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px var(--shadow);
  }

  .login-wrap h1 {
    font-family: 'Lalezar', 'Cairo', sans-serif;
    font-size: 3rem;
    font-weight: 400;
    color: var(--orange);
    margin-bottom: 6px;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(255, 107, 26, 0.5);
  }

  .login-wrap .subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    margin-bottom: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .pw-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .pw-wrap input {
    width: 100%;
    padding: 16px 56px 16px 16px;
    border: 3px solid var(--border);
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    background: var(--bg-3);
    color: var(--text);
    transition: border-color 0.2s;
  }

  .pw-wrap input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 15px rgba(255, 107, 26, 0.2);
  }

  .toggle-pw {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    color: var(--text-muted);
  }

  .toggle-pw:hover { background: var(--bg-4); }

  #loginErr {
    color: var(--danger);
    font-size: 0.9rem;
    margin-top: 12px;
    min-height: 22px;
    font-weight: 700;
  }

  .login-hint {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 20px;
    line-height: 1.6;
  }

  /* ============ Buttons ============ */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-weight: 900;
    font-size: 1rem;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  }

  button:active { transform: scale(0.97); }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-primary {
    background: var(--orange);
    color: #FFFFFF;
    box-shadow: 0 6px 20px rgba(255, 107, 26, 0.4);
    font-size: 1.05rem;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--orange-dark);
    box-shadow: 0 10px 28px rgba(255, 107, 26, 0.55);
    transform: translateY(-2px);
  }

  .btn-secondary {
    background: var(--bg-3);
    color: var(--text);
    border: 2px solid var(--border);
  }

  .btn-secondary:hover { background: var(--bg-4); border-color: var(--orange); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  .btn-danger:hover { background: var(--danger); color: #FFFFFF; }

  .btn-add {
    background: transparent;
    color: var(--orange);
    border: 3px dashed var(--orange);
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    margin-top: 12px;
    border-radius: 14px;
  }

  .btn-add:hover { background: rgba(255, 107, 26, 0.08); }

  /* ============ Header ============ */
  #dashboard {
    max-width: 1000px;
    margin: 0 auto;
    display: none;
  }

  #dashboard.active { display: block; }

  .admin-header {
    background: var(--bg-2);
    border: 3px solid var(--orange);
    border-radius: 20px;
    padding: 20px 22px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: 0 10px 30px var(--shadow);
    position: sticky;
    top: 12px;
    z-index: 50;
  }

  .admin-header h1 {
    font-family: 'Lalezar', 'Cairo', sans-serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--orange);
    letter-spacing: 2px;
    margin: 0;
    text-shadow: 0 0 20px rgba(255, 107, 26, 0.4);
  }

  .admin-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ============ Cards ============ */
  .card {
    background: var(--bg-2);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px var(--shadow);
  }

  .card-title {
    font-family: 'Cairo', sans-serif;
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--orange);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--border);
  }

  .card-title .title-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    cursor: pointer;
  }

  .card-title .zone-icon { font-size: 1.6rem; }

  .toggle-chev {
    font-size: 1rem;
    transition: transform 0.2s;
    color: var(--text-muted);
  }

  .toggle-chev.open { transform: rotate(180deg); }

  .type-badge {
    font-size: 0.8rem;
    background: var(--bg-3);
    color: var(--text-muted);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 4px 12px;
    font-weight: 900;
  }

  .zone-body { display: none; }
  .zone-body.open { display: block; }

  /* ============ Form ============ */
  label {
    display: block;
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 900;
    letter-spacing: 0.3px;
  }

  input[type=text],
  input[type=number],
  textarea {
    width: 100%;
    background: var(--bg-3);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.2s;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 15px rgba(255, 107, 26, 0.15);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.6;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* ============ Product Box ============ */
  .item-box {
    background: var(--bg-3);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-top: 14px;
    position: relative;
  }

  .item-num {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--orange);
    color: #FFFFFF;
    font-size: 0.85rem;
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(255, 107, 26, 0.3);
  }

  .item-actions {
    display: flex;
    gap: 8px;
    position: absolute;
    top: 12px;
    right: 12px;
  }

  /* ============ Images Grid ============ */
  .images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .img-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 3px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-4);
    transition: border-color 0.2s;
  }

  .img-thumb:hover { border-color: var(--orange); }

  .img-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .img-thumb .img-del {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--danger);
    color: #FFFFFF;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 0.9rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(231, 76, 60, 0.5);
  }

  .img-add-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    aspect-ratio: 1 / 1;
    border: 3px dashed var(--orange);
    border-radius: 14px;
    background: rgba(255, 107, 26, 0.05);
    color: var(--orange);
    font-size: 2rem;
    cursor: pointer;
    font-weight: 900;
    transition: background 0.2s, transform 0.2s;
  }

  .img-add-btn:hover {
    background: rgba(255, 107, 26, 0.15);
    transform: scale(1.02);
  }

  .img-add-btn small {
    font-size: 0.85rem;
    font-weight: 900;
  }

  input[type="file"] { display: none; }

  /* ============ Sizes ============ */
  .size-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .size-chip {
    background: var(--bg-4);
    color: var(--text);
    border: 2px solid var(--border);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
  }

  .size-chip:hover {
    border-color: var(--orange);
    transform: translateY(-2px);
  }

  .size-chip.selected {
    background: var(--orange);
    color: #FFFFFF;
    border-color: var(--orange);
    box-shadow: 0 4px 12px rgba(255, 107, 26, 0.4);
  }

  .selected-sizes {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
    padding: 16px;
    background: var(--bg-4);
    border-radius: 12px;
    border: 2px solid var(--border);
    min-height: 60px;
  }

  .selected-size-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg-3);
    border-radius: 10px;
    border-right: 5px solid var(--orange);
  }

  .sz-label {
    flex: 1;
    font-weight: 900;
    font-size: 1.05rem;
    color: #FFFFFF;
  }

  .sz-price-input {
    width: 120px;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-weight: 900;
    font-size: 1rem;
    text-align: center;
    background: var(--bg-2);
    color: var(--text);
  }

  .sz-price-input:focus {
    outline: none;
    border-color: var(--orange);
  }

  .sz-del {
    background: var(--danger);
    color: #FFFFFF;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ============ Status Toast ============ */
  #statusMsg {
    position: fixed;
    bottom: 20px;
    right: 20px;
    left: 20px;
    max-width: 440px;
    margin: 0 auto;
    background: var(--bg-2);
    border: 4px solid var(--border);
    border-radius: 16px;
    padding: 18px 24px;
    text-align: center;
    font-weight: 900;
    font-size: 1rem;
    display: none;
    z-index: 100;
    box-shadow: 0 15px 40px var(--shadow);
  }

  #statusMsg.show { display: block; }
  #statusMsg.ok { border-color: var(--success); color: var(--success); }
  #statusMsg.err { border-color: var(--danger); color: var(--danger); }
  #statusMsg.loading { border-color: var(--orange); color: var(--orange); }

  /* ============ Loading ============ */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(6px);
  }

  #loadingOverlay.show { display: flex; }

  .loader {
    background: var(--bg-2);
    padding: 32px 42px;
    border-radius: 20px;
    text-align: center;
    border: 4px solid var(--orange);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    max-width: 340px;
  }

  .loader .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader p {
    font-weight: 900;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* ============ Visibility Toggle ============ */
  .vis-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-3);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 900;
    color: var(--text-muted);
    cursor: pointer;
    border: 2px solid var(--border);
    user-select: none;
    transition: all 0.2s;
  }

  .vis-toggle.on {
    background: rgba(39, 174, 96, 0.15);
    border-color: var(--success);
    color: var(--success);
  }

  .vis-toggle.off {
    background: rgba(231, 76, 60, 0.15);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ============ Save Bar ============ */
  .save-bar {
    position: sticky;
    bottom: 16px;
    background: var(--bg-2);
    border: 3px solid var(--orange);
    border-radius: 20px;
    padding: 16px;
    margin-top: 20px;
    box-shadow: 0 -8px 30px var(--shadow);
    z-index: 40;
  }

  .save-bar button {
    width: 100%;
    padding: 20px;
    font-size: 1.15rem;
  }

  /* ============ Responsive ============ */
  @media (max-width: 600px) {
    body { padding: 8px; font-size: 15px; }
    .admin-header { padding: 16px; gap: 10px; }
    .admin-header h1 { font-size: 1.5rem; }
    .admin-actions { width: 100%; justify-content: stretch; }
    .admin-actions button { flex: 1; padding: 12px 14px; font-size: 0.9rem; }
    .card { padding: 18px; }
    .item-box { padding: 14px; }
    .row-2 { grid-template-columns: 1fr; }
    .sz-price-input { width: 90px; }
    .login-wrap h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<div id="loginScreen" class="login-wrap">
  <h1>حنون</h1>
  <p class="subtitle">لوحة تحكم المتجر</p>
  
  <div class="pw-wrap">
    <input type="password" id="pwInput" placeholder="أدخل رمز الدخول" autocomplete="off">
    <button type="button" id="togglePw" class="toggle-pw">👁️</button>
  </div>
  
  <button class="btn-primary" style="width:100%;" id="loginBtn">🔓 دخول</button>
  <div id="loginErr"></div>
  <p class="login-hint">
    أدخل رمز GitHub Token الخاص بالمتجر<br>
    سيتم حفظه في المتصفح هذا فقط
  </p>
</div>

<!-- ============ Loading ============ -->
<div id="loadingOverlay">
  <div class="loader">
    <div class="spinner"></div>
    <p id="loadingText">جاري التحميل...</p>
  </div>
</div>

<!-- ============ Dashboard ============ -->
<div id="dashboard">
  
  <header class="admin-header">
    <h1>🎛️ لوحة تحكم حنون</h1>
    <div class="admin-actions">
      <button class="btn-secondary" id="reloadBtn">↻ تحديث</button>
      <button class="btn-primary" id="saveBtn">💾 حفظ</button>
      <button class="btn-secondary" id="logoutBtn">🔑 خروج</button>
    </div>
  </header>
  
  <!-- Config -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">⚙️</span>
        <span>الإعدادات العامة</span>
      </span>
    </div>
    <div id="configFields"></div>
  </div>
  
  <!-- Hero -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">🎬</span>
        <span>البانر الرئيسي (Hero Slider)</span>
      </span>
    </div>
    <div id="heroFields"></div>
  </div>
  
  <!-- Features -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">⭐</span>
        <span>المميزات (Features)</span>
      </span>
    </div>
    <div id="featuresFields"></div>
  </div>
  
  <!-- Offers -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">🔥</span>
        <span>العروض (Offers)</span>
      </span>
    </div>
    <div id="offersFields"></div>
  </div>
  
  <!-- Categories -->
  <div id="zonesWrap"></div>
  
  <button class="btn-add" id="addZoneBtn">+ إضافة قسم جديد</button>
  
  <!-- Save Bar -->
  <div class="save-bar">
    <button class="btn-primary" id="saveBtnBottom">💾 حفظ كل التعديلات</button>
  </div>
  
</div>

<div id="statusMsg"></div>

<script src="admin.js"></script>
</body>
</html>
