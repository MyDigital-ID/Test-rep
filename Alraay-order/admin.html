<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم جزارة الراعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1626; --panel:#161f36; --panel2:#1d2846; --orange:#ff7a1a; --orange-d:#e8650a;
    --text:#f1f3f8; --muted:#9aa5c0; --danger:#e64545; --green:#2fae5c; --border:#2a3660;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;min-height:100vh;}
  header{background:var(--panel);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:10px;}
  header h1{font-family:'Cairo',sans-serif;font-size:1.15rem;margin:0;color:var(--orange);}
  .topbtns{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.9rem;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-d);}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:6px 10px;font-size:.8rem;}
  .btn-add{background:transparent;color:var(--orange);border:1px dashed var(--orange);width:100%;margin-top:8px;padding:8px;}
  main{max-width:820px;margin:0 auto;padding:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
  .card h2{font-family:'Cairo',sans-serif;color:var(--orange);font-size:1rem;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .zone-icon{font-size:1.2rem;}
  label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;margin-top:10px;}
  input[type=text], input[type=number], textarea{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-family:inherit;font-size:.9rem;
  }
  textarea{resize:vertical;min-height:50px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .item-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;position:relative;}
  .item-box .btn-danger{position:absolute;top:8px;left:8px;}
  .price-list{display:flex;gap:8px;}
  .price-list input{width:80px;}
  .login-wrap{max-width:340px;margin:15vh auto;text-align:center;padding:0 16px;}
  .login-wrap h1{font-family:'Cairo',sans-serif;color:var(--orange);}
  #loginErr{color:var(--danger);font-size:.85rem;margin-top:8px;min-height:18px;}
  #statusMsg{position:fixed;bottom:16px;right:16px;left:16px;max-width:400px;margin:0 auto;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-align:center;font-weight:700;
    display:none;z-index:50;}
  #statusMsg.show{display:block;}
  #statusMsg.ok{border-color:var(--green);color:var(--green);}
  #statusMsg.err{border-color:var(--danger);color:var(--danger);}
  .hint{color:var(--muted);font-size:.75rem;margin-top:4px;}
  .toggle-content{display:none;}
  .toggle-content.open{display:block;}
  .chev{transition:transform .2s;}
  .chev.open{transform:rotate(180deg);}
  #configWrap.hidden, #app.hidden, #loading.hidden {display:none;}
  #loading{text-align:center;padding:60px 20px;color:var(--muted);}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <h1>🔒 لوحة تحكم جزارة الراعي</h1>
  <p class="hint">أدخل GitHub Token بتاعك (هيتحفظ في المتصفح ده بس)</p>
  <input type="text" id="pwInput" placeholder="ghp_xxxxxxxxxxxx" style="text-align:center;margin-top:10px" autocomplete="off">
  <button class="btn-primary" style="width:100%;margin-top:12px" id="loginBtn">دخول</button>
  <div id="loginErr"></div>
  <p class="hint" style="margin-top:20px">ملحوظة: اتأكد إن GITHUB_OWNER / GITHUB_REPO / GITHUB_BRANCH / GITHUB_PATH متظبطين في أول ملف admin.html قبل الاستخدام.</p>
</div>

<div id="app" class="hidden">
  <header>
    <h1>🐂 لوحة تحكم جزارة الراعي</h1>
    <div class="topbtns">
      <button class="btn-secondary" id="reloadBtn">↻ تحديث</button>
      <button class="btn-primary" id="saveBtn">💾 حفظ التعديلات</button>
      <button class="btn-secondary" id="logoutBtn">🔑 تغيير التوكن</button>
    </div>
  </header>
  <div id="loading">جاري التحميل...</div>
  <main id="mainContent" style="display:none">
    <div class="card" id="configCard">
      <h2>⚙️ الإعدادات العامة</h2>
      <div id="configFields"></div>
    </div>
    <div id="zonesWrap"></div>
    <button class="btn-add" id="addZoneBtn">+ إضافة قسم جديد</button>
  </main>
</div>

<div id="statusMsg"></div>

<script>
/* =====================================================
   Direct-to-GitHub mode: no backend server at all. The
   token you paste in on login is used straight from this
   browser to call the GitHub Contents API. Set these 4
   constants to match your repo before using the panel.
===================================================== */
const GITHUB_OWNER  = "MyDigital-ID";              // your GitHub username/org
const GITHUB_REPO   = "Test-rep";                  // repo name
const GITHUB_BRANCH = "main";                      // branch you deploy from
const GITHUB_PATH   = "Alraay-order/site-data.json"; // path to site-data.json INSIDE the repo

const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
const TOKEN_KEY = "alraay_admin_token";

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let siteData = null;
let currentSha = null;

const $ = (id) => document.getElementById(id);

function ghHeaders() {
  return { "Authorization": `Bearer ${TOKEN}`, "Accept": "application/vnd.github+json" };
}

// UTF-8 safe base64 helpers (GitHub API needs base64; Arabic text needs
// proper byte-level encoding, not the raw btoa()/atob() which only
// handle Latin1).
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ""));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

$("loginBtn").onclick = login;
$("pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("logoutBtn").onclick = () => {
  if (!confirm("هيتم مسح التوكن المحفوظ في المتصفح ده. متأكد؟")) return;
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
};

async function fetchFromGitHub() {
  const res = await fetch(`${API_URL}?ref=${GITHUB_BRANCH}`, { headers: ghHeaders() });
  if (res.status === 401) throw new Error("UNAUTHORIZED");
  if (!res.ok) throw new Error(`GitHub error ${res.status}`);
  const fileInfo = await res.json();
  currentSha = fileInfo.sha;
  return JSON.parse(base64ToUtf8(fileInfo.content));
}

async function login() {
  const tok = $("pwInput").value.trim() || TOKEN;
  if (!tok) return;
  $("loginErr").textContent = "";
  $("loginBtn").textContent = "جاري التحقق...";
  try {
    TOKEN = tok;
    siteData = await fetchFromGitHub();
    localStorage.setItem(TOKEN_KEY, TOKEN);
    $("loginScreen").style.display = "none";
    $("app").classList.remove("hidden");
    $("loading").classList.add("hidden");
    $("mainContent").style.display = "block";
    renderAll();
  } catch (e) {
    if (e.message === "UNAUTHORIZED") {
      $("loginErr").textContent = "التوكن غلط أو مالوش صلاحية على الريبو";
    } else {
      $("loginErr").textContent = "تعذر الاتصال بـ GitHub — تأكد من اسم الريبو/المسار في أول ملف admin.html: " + e.message;
    }
    $("loginBtn").textContent = "دخول";
  }
}

// If a token is already saved on this device, skip straight to login.
if (TOKEN) { $("pwInput").value = TOKEN; login(); }

$("reloadBtn").onclick = async () => {
  if (!confirm("هيتم تجاهل أي تعديل لسه ما اتحفظش. متأكد؟")) return;
  siteData = await fetchFromGitHub();
  renderAll();
};

$("saveBtn").onclick = async () => {
  $("saveBtn").textContent = "جاري الحفظ...";
  $("saveBtn").disabled = true;
  try {
    const newContent = JSON.stringify(siteData, null, 2);
    const res = await fetch(API_URL, {
      method: "PUT",
      headers: { ...ghHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "Update site-data.json via admin panel",
        content: utf8ToBase64(newContent),
        sha: currentSha,
        branch: GITHUB_BRANCH
      })
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.message || ("server error " + res.status));
    currentSha = out.content.sha; // keep sha fresh for the next save
    showStatus("تم الحفظ ✅ التحديث هيظهر على الموقع خلال دقيقة", "ok");
  } catch (e) {
    showStatus("فشل الحفظ: " + e.message, "err");
  }
  $("saveBtn").textContent = "💾 حفظ التعديلات";
  $("saveBtn").disabled = false;
};

function showStatus(msg, cls) {
  const el = $("statusMsg");
  el.textContent = msg;
  el.className = "show " + cls;
  setTimeout(() => { el.className = ""; }, 4500);
}

/* ---------------- CONFIG ---------------- */
function renderAll() {
  renderConfig();
  renderZones();
}

const CONFIG_FIELDS = [
  ["brand_ar", "اسم المحل (عربي)"], ["brand_en", "اسم المحل (إنجليزي)"],
  ["about_ar", "نبذة عننا (عربي)", true], ["about_en", "نبذة عننا (إنجليزي)", true],
  ["whatsappNumber", "رقم الواتساب (بالصيغة الدولية بدون +، مثال 201095786333)"],
  ["address_ar", "العنوان (عربي)", true], ["address_en", "العنوان (إنجليزي)", true],
  ["mapUrl", "رابط خرائط جوجل"],
  ["rights_ar", "جملة حقوق الملكية (عربي)"], ["rights_en", "جملة حقوق الملكية (إنجليزي)"]
];

function renderConfig() {
  const wrap = $("configFields");
  wrap.innerHTML = "";
  const cfg = siteData.config;
  CONFIG_FIELDS.forEach(([key, label, isArea]) => {
    const l = document.createElement("label");
    l.textContent = label;
    wrap.appendChild(l);
    const input = document.createElement(isArea ? "textarea" : "input");
    if (!isArea) input.type = "text";
    input.value = cfg[key] || "";
    input.oninput = () => { cfg[key] = input.value; };
    wrap.appendChild(input);
  });

  const pl = document.createElement("label");
  pl.textContent = "أرقام التليفونات";
  wrap.appendChild(pl);
  const phonesWrap = document.createElement("div");
  wrap.appendChild(phonesWrap);
  function renderPhones() {
    phonesWrap.innerHTML = "";
    cfg.phones.forEach((phone, i) => {
      const row = document.createElement("div");
      row.style.display = "flex"; row.style.gap = "8px"; row.style.marginTop = "6px";
      const input = document.createElement("input");
      input.type = "text"; input.value = phone;
      input.oninput = () => { cfg.phones[i] = input.value; };
      const del = document.createElement("button");
      del.className = "btn-danger"; del.textContent = "حذف"; del.style.position = "static";
      del.onclick = () => { cfg.phones.splice(i, 1); renderPhones(); };
      row.appendChild(input); row.appendChild(del);
      phonesWrap.appendChild(row);
    });
  }
  renderPhones();
  const addPhoneBtn = document.createElement("button");
  addPhoneBtn.className = "btn-add"; addPhoneBtn.textContent = "+ إضافة رقم";
  addPhoneBtn.onclick = () => { cfg.phones.push(""); renderPhones(); };
  wrap.appendChild(addPhoneBtn);
}

/* ---------------- ZONES ---------------- */
function renderZones() {
  const wrap = $("zonesWrap");
  wrap.innerHTML = "";
  siteData.zones.forEach((zone, zi) => wrap.appendChild(buildZoneCard(zone, zi)));
}

function buildZoneCard(zone, zi) {
  const card = document.createElement("div");
  card.className = "card";

  const h2 = document.createElement("h2");
  const chev = document.createElement("span");
  chev.className = "chev"; chev.textContent = "▾";
  const titleSpan = document.createElement("span");
  titleSpan.innerHTML = `<span class="zone-icon">${zone.icon || "📦"}</span> ${zone.name_ar || "(بدون اسم)"}`;
  const delZoneBtn = document.createElement("button");
  delZoneBtn.className = "btn-danger"; delZoneBtn.style.position = "static"; delZoneBtn.textContent = "حذف القسم";
  delZoneBtn.onclick = (e) => {
    e.stopPropagation();
    if (confirm(`متأكد من حذف قسم "${zone.name_ar}"؟`)) { siteData.zones.splice(zi, 1); renderZones(); }
  };
  const rightWrap = document.createElement("div");
  rightWrap.style.display = "flex"; rightWrap.style.gap = "8px"; rightWrap.style.alignItems = "center";
  rightWrap.appendChild(delZoneBtn); rightWrap.appendChild(chev);
  h2.appendChild(titleSpan); h2.appendChild(rightWrap);
  h2.style.cursor = "pointer";
  card.appendChild(h2);

  const body = document.createElement("div");
  body.className = "toggle-content";
  h2.onclick = () => { body.classList.toggle("open"); chev.classList.toggle("open"); };

  // basic zone fields
  body.appendChild(fieldRow("اسم القسم (عربي)", zone.name_ar, (v) => { zone.name_ar = v; titleSpan.innerHTML = `<span class="zone-icon">${zone.icon||"📦"}</span> ${v}`; }));
  body.appendChild(fieldRow("اسم القسم (إنجليزي)", zone.name_en, (v) => { zone.name_en = v; }));
  body.appendChild(fieldRow("أيقونة (إيموجي)", zone.icon, (v) => { zone.icon = v; titleSpan.innerHTML = `<span class="zone-icon">${v}</span> ${zone.name_ar}`; }));
  if (zone.type !== "gallery") {
    body.appendChild(fieldRow("مسار صورة رأس القسم (header)", zone.header, (v) => { zone.header = v; }));
  }

  const itemsHeading = document.createElement("label");
  itemsHeading.style.marginTop = "16px";
  itemsHeading.textContent = "المنتجات:";
  body.appendChild(itemsHeading);

  if (zone.type === "simple") {
    const itemsWrap = document.createElement("div");
    body.appendChild(itemsWrap);
    const render = () => renderSimpleItems(itemsWrap, zone.items, render, true);
    render();
    const addBtn = document.createElement("button");
    addBtn.className = "btn-add"; addBtn.textContent = "+ إضافة منتج";
    addBtn.onclick = () => { zone.items.push({ name_ar: "", name_en: "", price: 0, img: "" }); render(); };
    body.appendChild(addBtn);
  }

  if (zone.type === "weight") {
    body.appendChild(fieldRow("الأوزان المتاحة (مفصولة بفاصلة، مثال 1,0.75,0.5)", (zone.weights || []).join(","), (v) => {
      zone.weights = v.split(",").map(x => parseFloat(x.trim())).filter(x => !isNaN(x));
    }));
    const itemsWrap = document.createElement("div");
    body.appendChild(itemsWrap);
    const render = () => renderSimpleItems(itemsWrap, zone.items, render, false, "الجنيه/كيلو");
    render();
    const addBtn = document.createElement("button");
    addBtn.className = "btn-add"; addBtn.textContent = "+ إضافة منتج";
    addBtn.onclick = () => { zone.items.push({ name_ar: "", name_en: "", price: 0 }); render(); };
    body.appendChild(addBtn);
  }

  if (zone.type === "gallery") {
    const itemsWrap = document.createElement("div");
    body.appendChild(itemsWrap);
    const render = () => renderGalleryItems(itemsWrap, zone.items, render);
    render();
    const addBtn = document.createElement("button");
    addBtn.className = "btn-add"; addBtn.textContent = "+ إضافة صورة";
    addBtn.onclick = () => { zone.items.push({ name_ar: "", name_en: "", img: "" }); render(); };
    body.appendChild(addBtn);
  }

  if (zone.type === "variant") {
    const groupsWrap = document.createElement("div");
    body.appendChild(groupsWrap);
    const renderGroups = () => {
      groupsWrap.innerHTML = "";
      (zone.groups || []).forEach((g, gi) => {
        const box = document.createElement("div");
        box.className = "item-box";
        const del = document.createElement("button");
        del.className = "btn-danger"; del.textContent = "حذف";
        del.onclick = () => { zone.groups.splice(gi, 1); renderGroups(); };
        box.appendChild(del);
        box.appendChild(fieldRow("اسم (عربي)", g.name_ar, (v) => { g.name_ar = v; }));
        box.appendChild(fieldRow("اسم (إنجليزي)", g.name_en, (v) => { g.name_en = v; }));
        const pl = document.createElement("label"); pl.textContent = "الأسعار (حسب الحجم)"; box.appendChild(pl);
        const priceRow = document.createElement("div"); priceRow.className = "price-list";
        (g.prices || []).forEach((p, pi) => {
          const inp = document.createElement("input"); inp.type = "number"; inp.value = p;
          inp.oninput = () => { g.prices[pi] = parseFloat(inp.value) || 0; };
          priceRow.appendChild(inp);
        });
        box.appendChild(priceRow);
        groupsWrap.appendChild(box);
      });
    };
    renderGroups();
    const addGroupBtn = document.createElement("button");
    addGroupBtn.className = "btn-add"; addGroupBtn.textContent = "+ إضافة مجموعة أحجام";
    addGroupBtn.onclick = () => { zone.groups = zone.groups || []; zone.groups.push({ name_ar: "", name_en: "", prices: [0, 0, 0] }); renderGroups(); };
    body.appendChild(addGroupBtn);

    const extraHeading = document.createElement("label");
    extraHeading.style.marginTop = "16px";
    extraHeading.textContent = "أصناف إضافية بسعر ثابت:";
    body.appendChild(extraHeading);
    const extraWrap = document.createElement("div");
    body.appendChild(extraWrap);
    zone.extraSimple = zone.extraSimple || [];
    const renderExtra = () => renderSimpleItems(extraWrap, zone.extraSimple, renderExtra, false);
    renderExtra();
    const addExtraBtn = document.createElement("button");
    addExtraBtn.className = "btn-add"; addExtraBtn.textContent = "+ إضافة صنف إضافي";
    addExtraBtn.onclick = () => { zone.extraSimple.push({ name_ar: "", name_en: "", price: 0 }); renderExtra(); };
    body.appendChild(addExtraBtn);
  }

  card.appendChild(body);
  return card;
}

function fieldRow(label, value, onChange) {
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.textContent = label;
  const input = document.createElement("input"); input.type = "text"; input.value = value || "";
  input.oninput = () => onChange(input.value);
  wrap.appendChild(l); wrap.appendChild(input);
  return wrap;
}

function renderSimpleItems(container, items, rerender, withImg, priceLabel) {
  container.innerHTML = "";
  items.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "item-box";
    const del = document.createElement("button");
    del.className = "btn-danger"; del.textContent = "حذف";
    del.onclick = () => { items.splice(i, 1); rerender(); };
    box.appendChild(del);
    box.appendChild(fieldRow("الاسم (عربي)", item.name_ar, (v) => { item.name_ar = v; }));
    box.appendChild(fieldRow("الاسم (إنجليزي)", item.name_en, (v) => { item.name_en = v; }));
    const priceWrap = document.createElement("div");
    const pl = document.createElement("label"); pl.textContent = priceLabel || "السعر (جنيه)";
    const pInput = document.createElement("input"); pInput.type = "number"; pInput.value = item.price || 0;
    pInput.oninput = () => { item.price = parseFloat(pInput.value) || 0; };
    priceWrap.appendChild(pl); priceWrap.appendChild(pInput);
    box.appendChild(priceWrap);
    if (withImg) {
      box.appendChild(fieldRow("مسار الصورة (اختياري)", item.img, (v) => { item.img = v; }));
    }
    container.appendChild(box);
  });
}

function renderGalleryItems(container, items, rerender) {
  container.innerHTML = "";
  items.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "item-box";
    const del = document.createElement("button");
    del.className = "btn-danger"; del.textContent = "حذف";
    del.onclick = () => { items.splice(i, 1); rerender(); };
    box.appendChild(del);
    box.appendChild(fieldRow("الاسم (عربي)", item.name_ar, (v) => { item.name_ar = v; }));
    box.appendChild(fieldRow("الاسم (إنجليزي)", item.name_en, (v) => { item.name_en = v; }));
    box.appendChild(fieldRow("مسار الصورة", item.img, (v) => { item.img = v; }));
    container.appendChild(box);
  });
}

$("addZoneBtn").onclick = () => {
  const name = prompt("اسم القسم بالعربي:");
  if (!name) return;
  const type = prompt("نوع القسم:\nsimple = منتجات بسعر ثابت\nweight = بيع بالوزن (كيلو)\nvariant = أحجام متعددة (زي الحواوشي)\ngallery = صور عروض فقط (بدون سلة)", "simple");
  const id = "zone" + Date.now();
  const zone = { id, icon: "📦", name_ar: name, name_en: "", header: "", type: type || "simple" };
  if (type === "weight") { zone.weights = [1, 0.5]; zone.items = []; }
  else if (type === "variant") { zone.groups = []; zone.extraSimple = []; }
  else if (type === "gallery") { zone.items = []; }
  else { zone.items = []; }
  siteData.zones.push(zone);
  renderZones();
};
</script>
</body>
</html>
